# /opt/paas/docker-compose.yml — the entire server topology.
# Rules: only caddy publishes ports; every service has restart policy,
# log rotation, healthcheck, and a pinned ghcr.io image (SHA tag in prod).

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-defaults: &app-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [paas]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - paas_caddy_data:/data
      - paas_caddy_config:/config
      - paas_caddy_logs:/var/log/caddy
    networks: [paas]

  # Least-privilege gateway to the Docker socket for the dashboard.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: 1        # list/inspect/logs/stats
      POST: 1              # allow start/stop/restart
      IMAGES: 1
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [paas]

  # Redis — used by pms (BullMQ workers)
  redis:
    <<: *app-defaults
    image: redis:7-alpine
    container_name: paas-redis
    volumes:
      - paas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB — used by webpulse
  mongodb:
    <<: *app-defaults
    image: mongo:7.0
    container_name: paas-mongodb
    env_file: /opt/paas/env/mongodb.env   # MONGO_INITDB_ROOT_USERNAME, MONGO_INITDB_ROOT_PASSWORD
    volumes:
      - paas_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared MySQL — used by lanka-news
  mysql:
    <<: *app-defaults
    image: mysql:8.0
    container_name: paas-mysql
    env_file: /opt/paas/env/mysql.env    # MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE
    volumes:
      - paas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared PostgreSQL — used by invitation (and future apps that need Postgres)
  postgres:
    <<: *app-defaults
    image: postgres:16-alpine
    container_name: paas-postgres
    env_file: /opt/paas/env/postgres.env   # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - paas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    <<: *app-defaults
    image: ghcr.io/dilaxn/paas-dashboard:latest
    container_name: paas-dashboard
    env_file: /opt/paas/env/dashboard.env    # SESSION_SECRET, WEBHOOK_SECRET, GITHUB_PAT
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DATABASE_PATH: /data/dashboard.db
    volumes:
      - paas_dashboard_data:/data
      - paas_caddy_logs:/hostlogs/caddy:ro
      - /proc:/host/proc:ro                  # host CPU/RAM readings
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  lanka-news:
    <<: *app-defaults
    image: ghcr.io/dilaxn/lanka-news:latest
    container_name: paas-lanka-news
    env_file: /opt/paas/env/lanka-news.env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  invitation:
    <<: *app-defaults
    image: ghcr.io/dilaxn/invitation:latest
    container_name: paas-invitation
    env_file: /opt/paas/env/invitation.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  pms:
    <<: *app-defaults
    image: ghcr.io/dilaxn/pms:latest
    container_name: paas-pms
    env_file: /opt/paas/env/pms.env
    environment:
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prince:
    <<: *app-defaults
    image: ghcr.io/dilaxn/prince:latest
    container_name: paas-prince
    env_file: /opt/paas/env/prince.env
    environment:
      PORT: 3004
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  webpulse:
    <<: *app-defaults
    image: ghcr.io/dilaxn/webpulse:latest
    container_name: paas-webpulse
    env_file: /opt/paas/env/webpulse.env
    environment:
      PORT: 3005
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  paas:
    driver: bridge

volumes:
  paas_caddy_data:
  paas_caddy_config:
  paas_caddy_logs:
  paas_dashboard_data:
  paas_lanka_news_data:
  paas_redis_data:
  paas_mongodb_data:
  paas_mysql_data:
  paas_postgres_data:
  paas_invitation_data:
  paas_pms_data:
  paas_prince_data:
  paas_webpulse_data:
