name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency: deploy-dashboard

env:
  IMAGE: ghcr.io/dilaxn/paas-dashboard

jobs:
  build:
    runs-on: ubuntu-24.04-arm          # native ARM64 runner — no QEMU needed
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_KEY_SECRET }}
      AWS_DEFAULT_REGION: ap-south-1
      SG_ID: sg-09c36ce8067f2b51d
    steps:
      - name: Open SSH for runner
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32 || true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/paas
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull dashboard
            docker compose up -d dashboard
            docker image prune -f
            echo "Dashboard deployed: ${{ github.sha }}"

      - name: Record deployment
        if: always()
        run: |
          curl -sf -X POST https://ops.dilax.space/api/hooks/deployment \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"app\":\"dashboard\",\"sha\":\"${{ github.sha }}\",\"status\":\"${{ job.status == 'success' && 'success' || 'failed' }}\",\"actor\":\"${{ github.actor }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32 || true
