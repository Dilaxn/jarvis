# Copy to each app repo as .github/workflows/deploy.yml
# Required repo secrets:
#   EC2_HOST, EC2_SSH_KEY (deploy user's private key)
#   DASHBOARD_WEBHOOK_URL (https://ops.<domain>/api/hooks/deployment)
#   DASHBOARD_WEBHOOK_SECRET
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (tiny IAM user that may ONLY edit sg-web SSH rule)
# Required repo variables: APP_NAME (compose service name), SG_ID (security group id), AWS_REGION

name: Build & Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      image_tag: { description: "Existing tag to deploy (rollback). Empty = build HEAD.", required: false }

concurrency: deploy-${{ vars.APP_NAME }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !inputs.image_tag }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # cross-build for Graviton (arm64)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_ENV"

      - name: Notify dashboard (deploying)
        run: |
          BODY='{"app":"${{ vars.APP_NAME }}","sha":"${{ github.sha }}","image_tag":"'"$TAG"'","status":"deploying","ci_run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.DASHBOARD_WEBHOOK_SECRET }}" | cut -d' ' -f2)
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-Signature: $SIG" -d "$BODY" "${{ secrets.DASHBOARD_WEBHOOK_URL }}" || true

      - name: Open SSH to runner IP
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id ${{ vars.SG_ID }} \
            --protocol tcp --port 22 --cidr "$IP/32" --region ${{ vars.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/paas
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sed -i "s|${{ env.IMAGE }}:.*|${{ env.IMAGE }}:${{ env.TAG }}|" docker-compose.yml
            docker compose pull ${{ vars.APP_NAME }}
            docker compose up -d ${{ vars.APP_NAME }}
            docker image prune -f

      - name: Close SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ vars.SG_ID }} \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" --region ${{ vars.AWS_REGION }} || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Notify dashboard (final)
        if: always()
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo success || echo failed)
          BODY='{"app":"${{ vars.APP_NAME }}","sha":"${{ github.sha }}","image_tag":"'"$TAG"'","status":"'"$STATUS"'","ci_run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.DASHBOARD_WEBHOOK_SECRET }}" | cut -d' ' -f2)
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-Signature: $SIG" -d "$BODY" "${{ secrets.DASHBOARD_WEBHOOK_URL }}" || true
